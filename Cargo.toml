[package]
name = "concordance"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A library for negotiating HDMI 2.1 modes."
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/ashlar-display/concordance"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "negotiation", "display"]
categories = ["hardware-support", "embedded", "no-std", "no-std::no-alloc"]

[features]
default = ["std"]
std = ["alloc", "display-types/std"]
alloc = ["display-types/alloc"]
serde = ["dep:serde", "display-types/serde"]

[dependencies]
bitflags = "2.4"
display-types = { version = "0.4", default-features = false }
thiserror = { version = "2", default-features = false }
serde = { version = "1.0", optional = true, features = ["derive"] }

[dev-dependencies]
display-types = { version = "0.4", features = ["std"] }
serde_json = "1"
